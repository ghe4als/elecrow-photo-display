; PlatformIO ESP32 Starter Project
; ----------------------------------------------------------------------------
; Multiple environments target different ESP32 variants. Pick the one that
; matches your board with `pio run -e <env>` (or select it in the VS Code
; PlatformIO toolbar). Flash + monitor with: pio run -e <env> -t upload -t monitor
;
; Environments:
;   esp32dev-arduino     generic ESP32 (original, DevKitC v1, NodeMCU-32S, WROOM-32)
;   esp32-s3-arduino     ESP32-S3 DevKitC-1 (native USB CDC)
;   esp32dev-idf         same as esp32dev-arduino but ESP-IDF framework
;   native               host unit tests (pio test -e native)
;
; Common board aliases you can swap `board` for:
;   esp32dev             generic ESP32
;   esp32-s3-devkitc-1   ESP32-S3 DevKitC-1
;   esp32-c3-devkitm-1   ESP32-C3
;   esp32-wroom-32
;   d32_pro
;
; Testing note: `pio test` (bare) targets `default_envs`, which is build/flash-
; only and will fail to link on-target tests. Run host unit tests with:
;   pio test -e native
; On-target tests (pio test -e esp32dev-arduino) require Arduino
; setup()/loop()-style test files under test/ (future work).
; ----------------------------------------------------------------------------

[platformio]
default_envs = esp32dev-arduino

; ---- shared settings applied to every ESP32 env ---------------------------
[esp32-base]
platform          = espressif32
upload_speed      = 921600
monitor_speed     = 115200
monitor_filters   = esp32_exception_decoder
build_flags       =
    -DCORE_DEBUG_LEVEL=3

; ---- Generic ESP32 (original) - Arduino -----------------------------------
[env:esp32dev-arduino]
extends          = esp32-base
board            = esp32dev
framework        = arduino
build_src_filter = +<*> -<idf/>
build_flags      =
    ${esp32-base.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBLINK_PIN=2
    ; WiFi credentials for src/main.cpp. Override here or in include/wifi_config.h.
    -DWIFI_SSID=\"${sysenv.WIFI_SSID}\"
    -DWIFI_PASS=\"${sysenv.WIFI_PASS}\"
lib_deps         =

; ---- ESP32-S3 DevKitC-1 - Arduino (native USB CDC) ------------------------
; Use this if esptool reports "This chip is ESP32-S3, not ESP32".
; Serial goes over the S3's built-in USB (port shows as /dev/cu.usbmodem*).
; BLINK_PIN=48 is the onboard RGB LED; digitalWrite toggles it (dim) but for a
; proper RGB blink swap in the NeoPixel driver. GPIO2 also works if wired.
[env:esp32-s3-arduino]
extends          = esp32-base
board            = esp32-s3-devkitc-1
framework        = arduino
build_src_filter = +<*> -<idf/>
build_flags      =
    ${esp32-base.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBLINK_PIN=48
    -DWIFI_SSID=\"${sysenv.WIFI_SSID}\"
    -DWIFI_PASS=\"${sysenv.WIFI_PASS}\"
lib_deps         =

; ---- Generic ESP32 - ESP-IDF (optional alternative) -----------------------
[env:esp32dev-idf]
extends          = esp32-base
board            = esp32dev
framework        = espidf
build_flags      =
    ${esp32-base.build_flags}
    -DIDF_TARGET=\"esp32\"

; ---- Native host environment for unit tests -------------------------------
; Run with:  pio test -e native
;            pio run -e native
[env:native]
platform         = native
build_flags       =
    -DUNITY_INCLUDE_CONFIG_H
    -Iinclude
    -Itest
build_src_filter  = +<../src/starter.cpp>
test_build_src   = yes