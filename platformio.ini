; PlatformIO ESP32 Starter Project
; ----------------------------------------------------------------------------
; Multiple environments target different ESP32 variants. Pick the one that
; matches your board with `pio run -e <env>` (or select it in the VS Code
; PlatformIO toolbar). Flash + monitor with: pio run -e <env> -t upload -t monitor
;
; Environments:
;   esp32dev-arduino     generic ESP32 (original, DevKitC v1, NodeMCU-32S, WROOM-32)
;   esp32-s3-arduino     ESP32-S3 DevKitC-1 (native USB CDC)
;   esp32dev-idf         same as esp32dev-arduino but ESP-IDF framework
;   crowpanel-5          Elecrow CrowPanel 5.0" HMI (ESP32-S3, RGB + GT911 + LVGL)
;   native               host unit tests (pio test -e native)
;
; Common board aliases you can swap `board` for:
;   esp32dev             generic ESP32
;   esp32-s3-devkitc-1   ESP32-S3 DevKitC-1
;   esp32-c3-devkitm-1   ESP32-C3
;   esp32-wroom-32
;   d32_pro
;
; Testing note: `pio test` (bare) targets `default_envs`, which is build/flash-
; only and will fail to link on-target tests. Run host unit tests with:
;   pio test -e native
; On-target tests (pio test -e esp32dev-arduino) require Arduino
; setup()/loop()-style test files under test/ (future work).
; ----------------------------------------------------------------------------

[platformio]
default_envs = crowpanel-5

; ---- shared settings applied to every ESP32 env ---------------------------
[esp32-base]
platform          = espressif32
extra_scripts     = pre:scripts/load_env.py
upload_speed      = 921600
monitor_speed     = 115200
monitor_filters   = esp32_exception_decoder
build_flags       =
    -DCORE_DEBUG_LEVEL=3

; ---- Generic ESP32 (original) - Arduino -----------------------------------
[env:esp32dev-arduino]
extends          = esp32-base
board            = esp32dev
framework        = arduino
build_src_filter = +<*> -<idf/> -<crowpanel/>
build_flags      =
    ${esp32-base.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBLINK_PIN=2
lib_deps         =

; ---- ESP32-S3 DevKitC-1 - Arduino (native USB CDC) ------------------------
; Use this if esptool reports "This chip is ESP32-S3, not ESP32".
; Serial goes over the S3's built-in USB (port shows as /dev/cu.usbmodem*).
; BLINK_PIN=48 is the onboard RGB LED; digitalWrite toggles it (dim) but for a
; proper RGB blink swap in the NeoPixel driver. GPIO2 also works if wired.
[env:esp32-s3-arduino]
extends          = esp32-base
board            = esp32-s3-devkitc-1
framework        = arduino
build_src_filter = +<*> -<idf/> -<crowpanel/>
build_flags      =
    ${esp32-base.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBLINK_PIN=48
lib_deps         =

; ---- Generic ESP32 - ESP-IDF (optional alternative) -----------------------
[env:esp32dev-idf]
extends          = esp32-base
board            = esp32dev
framework        = espidf
build_src_filter = +<*> -<crowpanel/>
build_flags      =
    ${esp32-base.build_flags}
    -DIDF_TARGET=\"esp32\"

; ---- Native host environment for unit tests -------------------------------
; Run with:  pio test -e native
;            pio run -e native
[env:native]
platform         = native
build_flags       =
    -DUNITY_INCLUDE_CONFIG_H
    -Iinclude
    -Itest
build_src_filter  = +<../src/starter.cpp> +<../src/weather_utils.cpp>
test_build_src   = yes

; ---- Elecrow CrowPanel 5.0" ESP32-S3 HMI (V3.0 hardware) -------------------
; 800x480 RGB TFT (ILI6122/ILI5960) driven by LovyanGFX + GT911 capacitive
; touch via PCA9557 reset expander, LVGL 9.1.0 UI. Flash + monitor:
;   pio run -e crowpanel-5 -t upload -t monitor
; Auto-detect: python3 scripts/detect.py  (prints ENV=esp32-s3-arduino on S3)
[env:crowpanel-5]
extends          = esp32-base
platform         = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board            = esp32-s3-devkitc-1-myboard
boards_dir       = boards
framework        = arduino
board_build.partitions = boards/huge_app.csv
upload_speed     = 460800
monitor_speed    = 115200
build_src_filter = +<*> -<idf/> -<main.cpp> -<starter.cpp>
lib_deps =
    lvgl/lvgl@9.1.0
    bblanchon/ArduinoJson@^7
build_flags =
    ${esp32-base.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBLINK_PIN=2
    -D LV_CONF_SKIP
    -D LV_KCONFIG_IGNORE
    -D LV_COLOR_DEPTH=16
    -D LV_USE_LOG=1
    -D LV_LOG_LEVEL=LV_LOG_LEVEL_WARN
    -D LV_FONT_MONTSERRAT_40=1
    -D LV_USE_TJPGD=1
    -D LV_USE_LODEPNG=1
    -D LV_USE_BMP=1
    -Iinclude